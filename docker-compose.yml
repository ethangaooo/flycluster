    volumes:
      - node-data:/app/data
      - ./data:/connectomes:ro

  orchestrator:
    <<: *flycluster
    command: uvicorn services.orchestrator.app:app --host 0.0.0.0 --port 8000
    environment:
      FLYCLUSTER_API_KEYS: ${FLYCLUSTER_API_KEYS:-local:dev-local-key:600}
      FLYCLUSTER_MEMORY_HUB_URL: http://memory-hub:8100
      # 页面上的"数据来源"下拉要列出磁盘上的真实连接组，所以调度器也必须能读到它们。
      # 只挂给脑容器是不够的：调度器读不到，下拉框里就只剩合成图。
      FLYCLUSTER_CONNECTOME_DIR: /connectomes
      FLYCLUSTER_BRAIN_URLS: http://brain-1:8000,http://brain-2:8000,http://brain-3:8000,http://brain-4:8000,http://brain-5:8000,http://brain-6:8000,http://brain-7:8000,http://brain-8:8000,http://brain-9:8000,http://brain-10:8000,http://brain-11:8000,http://brain-12:8000,http://brain-13:8000,http://brain-14:8000,http://brain-15:8000,http://brain-16:8000
      FLYCLUSTER_DATA: /app/data
      FLYCLUSTER_ADMIN_DIST: /app/admin-ui/dist
    volumes:
      - memory-data:/app/data
      - ./data:/connectomes:ro
      - ./artifacts:/app/artifacts
      - ./admin-ui/dist:/app/admin-ui/dist:ro
    ports:
      - "8800:8000"
    depends_on:
      - memory-hub
      - brain-1
      - brain-2
      - brain-3
      - brain-4
      - env-service

volumes:
  memory-data:
  node-data:
