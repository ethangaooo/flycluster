# FlyCluster：Docker 多容器编排
#
#   记忆中枢（独立持久化卷） + 环境/评估 + 4 个脑节点容器 + 中枢调度（含开放 API 与管理端）
#
#   docker compose up --build
#   控制台：http://localhost:8800/
#   API：  http://localhost:8800/v1/health
#
# 关键纪律：脑容器之间**不直连**，消息一律经中枢调度转发，并在调度器里统一记账
# （延迟、丢失、字节数）。否则通信预算无法核算，实验失去意义。

# 五个服务共用同一份 Dockerfile。显式给出 image 名，compose 才会只构建一次并复用，
# 否则它会为每个服务各构建一遍（每次都要跑 pip install）。
x-flycluster: &flycluster
  build:
    context: .
    # 国内网络下官方 PyPI 很慢。不改文件，用环境变量覆盖即可：
    #   PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple docker compose up --build
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  image: flycluster:dev

x-brain-env: &brain-env
  MEMORY_HUB_URL: http://memory-hub:8100
  BRAIN_CONNECTOME: ${BRAIN_CONNECTOME:-synthetic-2000}
  # 只读挂入的目录（见下方 ./data:/connectomes:ro），用于加载抓取到的真实连接组 .npz
  BRAIN_CONNECTOME_DIR: /connectomes
  BRAIN_STEPS_PER_TICK: ${BRAIN_STEPS_PER_TICK:-20}
  BRAIN_MESSAGE_KIND: ${BRAIN_MESSAGE_KIND:-learned_compressed}
  BRAIN_SYNAPTIC_SCALE: ${BRAIN_SYNAPTIC_SCALE:-0.35}
  BRAIN_BACKGROUND: ${BRAIN_BACKGROUND:-14}
  BRAIN_NOISE: ${BRAIN_NOISE:-6}
  DATA_DIR: /app/data

services:
  memory-hub:
    <<: *flycluster
    command: uvicorn services.memory_hub.app:app --host 0.0.0.0 --port 8100
    environment:
      MEMORY_DB_PATH: /app/data/memory_hub.sqlite3
    volumes:
      - memory-data:/app/data
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  env-service:
    <<: *flycluster
    command: uvicorn services.env.app:app --host 0.0.0.0 --port 8200
    ports:
      - "8200:8200"

  brain-1:
    <<: *flycluster
    command: uvicorn services.brain.app:app --host 0.0.0.0 --port 8000
    environment:
      <<: *brain-env
      BRAIN_NODE_ID: node-0
      BRAIN_SEED: "0"
    volumes:
      - node-data:/app/data
      - ./data:/connectomes:ro

  brain-2:
    <<: *flycluster
    command: uvicorn services.brain.app:app --host 0.0.0.0 --port 8000
    environment:
      <<: *brain-env
      BRAIN_NODE_ID: node-1
      BRAIN_SEED: "1"
    volumes:
      - node-data:/app/data
      - ./data:/connectomes:ro

  brain-3:
